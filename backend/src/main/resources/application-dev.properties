# Local Dev Configuration (PostgreSQL in Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/kfashn_db
spring.datasource.username=kfashn_user
spring.datasource.password=kfashn_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway config
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JWT Secret (Hardcoded for dev only)
jwt.secret=413F4428472B4B6250655368566D5970337336763979244226452948404D6351
jwt.expiration=86400000

# File Uploads (Using Cloudinary in Dev for testing, or local fallback)
file.upload-dir=uploads

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.config.import=optional:file:.env[.properties]

# Increase file upload limits to avoid 502 Bad Gateway on large images
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
