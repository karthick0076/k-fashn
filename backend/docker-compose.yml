version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: kfashn_postgres
    environment:
      POSTGRES_USER: kfashn_user
      POSTGRES_PASSWORD: kfashn_password
      POSTGRES_DB: kfashn_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
