services:
  - type: web
    name: kfashn-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    region: oregon
    plan: free
    envVars:
      - key: DB_URL
        fromDatabase:
          name: kfashn-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: kfashn-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: kfashn-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false

databases:
  - name: kfashn-db
    databaseName: kfashn
    user: kfashn_user
    plan: free
    region: oregon
